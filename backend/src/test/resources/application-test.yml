server:
  port: 0

spring:
  application:
    name: autovista-backend-test

  datasource:
    url: jdbc:h2:mem:autovista_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false

  flyway:
    enabled: false

autovista:
  jwt:
    secret: AutoVistaTestSecretKeyForJwtTokenValidation2026SuperSecureKeyWithSufficientLength
    expiration-ms: 3600000
  cors:
    allowed-origins: http://localhost:5173
